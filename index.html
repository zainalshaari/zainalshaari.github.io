<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jekyll Posts</title>
    <style>
        body {
            max-width: 760px;
            margin: 50px auto;
            font: 20px Segoe UI, sans-serif;
        }
    </style>
</head>
<body>
    <h2>Jekyll Posts</h2>

    {% for item in site.posts %}
        <h3>{{item.title}}</h3>
        <p>{{item.content}}</p>
    {% endfor %}

</body>
</html>

{{site.posts}}
